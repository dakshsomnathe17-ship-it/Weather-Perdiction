version: '3.9'
services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_ARCGIS_ACCESS_TOKEN: ${VITE_ARCGIS_ACCESS_TOKEN:-}
        VITE_ESRI_IMAGERY_URL: ${VITE_ESRI_IMAGERY_URL:-}
        VITE_ESRI_LABELS_URL: ${VITE_ESRI_LABELS_URL:-}
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - weather-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/weather_ai
      - REDIS_URL=redis://redis:6379
      - NOMINATIM_CACHE_PATH=/app/cache/nominatim-cache.sqlite3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/ml_models
      - nominatim_cache:/app/cache
    networks:
      - weather-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

volumes:
  postgres_data:
  redis_data:
  ml_models:
  nominatim_cache:

networks:
  weather-net:
    driver: bridge
